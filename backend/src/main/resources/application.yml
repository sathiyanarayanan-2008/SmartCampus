server:
  port: 8080

spring:
  application:
    name: smart-campus-service-hub

  data:
    mongodb:
      uri: mongodb://localhost:27017/smart_campus_db

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# JWT Configuration
jwt:
  secret: SmartCampusServiceHub2024SecretKeyForJWTTokenGenerationAndValidation
  expiration: 86400000  # 24 hours in milliseconds

# CORS Configuration
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

# Logging
logging:
  level:
    root: INFO
    com.smartcampus: DEBUG
    org.springframework.security: INFO
